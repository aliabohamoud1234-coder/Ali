<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c2e">
<title>غرفة العمليات المشتركة</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#101a24;--mute:#66737f;--line:#dde3e9;--acc:#a8832f;--acc-ink:#fff;--mine:#f3e9cf;--other:#fff;--err:#b42318;--navy:#0f1c2e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121b;--card:#142030;--ink:#e9eef3;--mute:#8b98a5;--line:#243447;--acc:#d4a84b;--acc-ink:#1a1405;--mine:#3a2f14;--other:#18273a;--err:#f97066}}
:root[data-theme="dark"]{--bg:#0b121b;--card:#142030;--ink:#e9eef3;--mute:#8b98a5;--line:#243447;--acc:#d4a84b;--acc-ink:#1a1405;--mine:#3a2f14;--other:#18273a;--err:#f97066}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
.screen{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.hidden{display:none!important}
#join{justify-content:center;padding:20px;overflow-y:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.big{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 14px;border:2px solid var(--acc)}
h1{font-size:22px;margin:0 0 6px;text-align:center}
p.sub{color:var(--mute);margin:0 0 14px;line-height:1.6;text-align:center}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--acc)}
#code{letter-spacing:2px;text-transform:uppercase;direction:ltr;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--acc);color:var(--acc-ink);font-weight:600}
button:disabled{opacity:.5}
button.full{width:100%;margin-top:16px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-weight:500;font-size:14px}
button.link{background:none;color:var(--acc);padding:6px;font-size:14px;width:100%;margin-top:8px}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--navy);color:#fff}
header img.lg{width:42px;height:42px;border-radius:50%;border:1.5px solid #d4a84b}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:15px}
header .t span{font-size:12px;opacity:.7}
header button.ghost{color:#fff;border-color:#ffffff40;padding:6px 10px;font-size:13px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:88%;align-self:flex-start}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.m{padding:8px 12px;border-radius:14px;background:var(--other);border:1px solid var(--line);overflow-wrap:anywhere;min-width:0}
.row.me .m{background:var(--mine)}
.m .n{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:2px;cursor:pointer}
.m .x{white-space:pre-wrap;line-height:1.5}
.m .x a{color:var(--acc);text-decoration:underline;word-break:break-all}
.m img.md,.m video.md{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:2px 0 4px;cursor:zoom-in}
.m .tm{font-size:11px;color:var(--mute);margin-top:3px;text-align:left;direction:ltr}
.sys{align-self:center;font-size:13px;color:var(--mute);padding:20px;text-align:center}
form#f{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line);align-items:center}
form#f input[type=text]{flex:1}
#att{padding:10px 12px;font-size:18px}
#pend{font-size:12px;color:var(--mute);padding:4px 14px;background:var(--card)}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90%;overflow-y:auto}
.ov img.full{max-width:100%;max-height:100%;border-radius:8px}
.codeitem{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;font-size:14px}
.codeitem b{direction:ltr;flex:1;letter-spacing:1px}
.codeitem.off b{text-decoration:line-through;opacity:.5}
.pv{text-align:center}.pv .av{width:90px;height:90px;font-size:36px;margin:0 auto 10px;cursor:default}
</style>
</head>
<body>

<div id="join" class="screen">
  <div class="card">
    <img class="big" alt="" src="logo.jpg">
    <h1>غرفة العمليات المشتركة</h1>
    <p class="sub">أدخل رمز الدعوة الذي وصلك للانضمام إلى الغرفة.</p>
    <label for="name">اسمك</label>
    <input id="name" maxlength="24" placeholder="مثال: أحمد" autocomplete="nickname">
    <label for="code">رمز الدعوة</label>
    <input id="code" maxlength="48" placeholder="OPS-XXXXXXXX" autocomplete="off">
    <div class="err" id="jerr"></div>
    <button class="full" id="go">انضمام</button>
    <button class="link" id="adm">🔑 دخول المالك</button>
  </div>
</div>

<div id="chat" class="screen hidden">
  <header>
    <img class="lg" alt="" src="logo.jpg">
    <div class="t"><b>غرفة العمليات المشتركة</b><span id="meta"></span></div>
    <button class="ghost" id="me">👤 ملفي</button>
    <button class="ghost hidden" id="adm2">🔑 الرموز</button>
  </header>
  <div id="msgs"><div class="sys">جارٍ تحميل الرسائل…</div></div>
  <div id="pend" class="hidden"></div>
  <form id="f" autocomplete="off">
    <button type="button" class="ghost" id="att" title="صورة أو فيديو">📎</button>
    <input type="file" id="file" accept="image/*,video/*" class="hidden">
    <input type="text" id="txt" maxlength="1000" placeholder="اكتب رسالة أو الصق رابطًا…" enterkeyhint="send">
    <button type="submit">إرسال</button>
  </form>
</div>

<div id="modal" class="ov hidden"><div class="box" id="mbox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var cfg=window.APP_CONFIG||{};
  var sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  var uid=null,isAdmin=false,prof={name:"",bio:"",avatar:""},profs={},all=[],chan=null,booted=false;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function clean(c){return String(c||"").trim().replace(/^.*#/,"").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,48)}
  function url(path){return sb.storage.from("media").getPublicUrl(path).data.publicUrl}
  function avatar(p,click){
    var a=el("div","av");
    if(p&&p.avatar){var i=el("img");i.src=url(p.avatar);i.alt="";a.appendChild(i)}else a.textContent=((p&&p.name)||"؟").trim().charAt(0)||"؟";
    if(click)a.onclick=click;return a;
  }
  function modal(n){var b=$("mbox");b.innerHTML="";b.appendChild(n);$("modal").classList.remove("hidden")}
  function closeM(){$("modal").classList.add("hidden")}
  $("modal").onclick=function(e){if(e.target===$("modal"))closeM()};
  function err(t){$("jerr").textContent=t}

  var h=clean(location.hash);
  if(h)$("code").value=h;
  if(ls("ops_name"))$("name").value=ls("ops_name");

  async function boot(){
    if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.indexOf("YOUR-")>-1){err("لم يتم ضبط ملف config.js بعد.");$("go").disabled=true;return}
    var s=await sb.auth.getSession();
    if(!s.data.session){
      var r=await sb.auth.signInAnonymously();
      if(r.error){err("تعذّر فتح الجلسة. تأكد من تفعيل Anonymous sign-ins في Supabase.");$("go").disabled=true;return}
      s=await sb.auth.getSession();
    }
    uid=s.data.session.user.id;
    var a=await sb.rpc("is_admin");isAdmin=a.data===true;
    var m=await sb.rpc("is_member");
    if(m.data===true){
      var p=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
      if(p.data)prof=p.data;else{prof={name:"المالك",bio:"",avatar:""};await saveProf()}
      enter();
    }
  }
  boot().catch(function(){err("تعذّر الاتصال بالخادم.")});

  $("go").onclick=async function(){
    var nm=$("name").value.trim(),code=clean($("code").value);
    if(!nm)return err("اكتب اسمك أولًا.");
    if(code.length<4)return err("أدخل رمز الدعوة كاملًا.");
    if(!uid)return;
    $("go").disabled=true;err("");
    var r=await sb.rpc("join_room",{p_code:code,p_name:nm});
    $("go").disabled=false;
    if(r.error)return err("تعذّر التحقق من الرمز. حاول مرة أخرى.");
    if(r.data!==true)return err("الرمز غير صحيح أو لم يعد مفعّلًا.");
    ls("ops_name",nm);
    var p=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
    prof=p.data||{name:nm,bio:"",avatar:""};
    enter();
  };
  $("code").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});

  async function saveProf(){
    var r=await sb.from("profiles").upsert({id:uid,name:prof.name||"",bio:prof.bio||"",avatar:prof.avatar||"",updated_at:new Date().toISOString()});
    if(r.error)throw r.error;
  }

  function render(){
    var box=$("msgs"),stick=box.scrollHeight-box.scrollTop-box.clientHeight<100;
    box.innerHTML="";
    if(!all.length){box.appendChild(el("div","sys","لا توجد رسائل بعد. ابدأ المحادثة."));return}
    all.forEach(function(m){
      var me=m.user_id===uid,p=me?prof:(profs[m.user_id]||{});
      var row=el("div","row"+(me?" me":""));
      row.appendChild(avatar(p,function(){showProf(m.user_id)}));
      var b=el("div","m");
      if(!me){var n=el("div","n",p.name||"عضو");n.onclick=function(){showProf(m.user_id)};b.appendChild(n)}
      if(m.media){
        var md;
        if(m.kind==="video"){md=el("video","md");md.controls=true;md.preload="metadata";md.setAttribute("playsinline","")}
        else{md=el("img","md");md.alt="";md.onclick=function(){var o=el("img","full");o.src=md.src;modal(o)}}
        md.src=url(m.media);b.appendChild(md);
      }
      if(m.text){var x=el("div","x");linkify(x,m.text);b.appendChild(x)}
      b.appendChild(el("div","tm",new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})));
      row.appendChild(b);box.appendChild(row);
    });
    if(stick)box.scrollTop=box.scrollHeight;
  }
  function addMsg(m){if(!all.some(function(x){return x.id===m.id})){all.push(m);render()}}

  async function enter(){
    if(booted)return;booted=true;
    $("join").classList.add("hidden");$("chat").classList.remove("hidden");
    if(isAdmin)$("adm2").classList.remove("hidden");
    try{history.replaceState(null,"",location.pathname)}catch(e){}
    var ps=await sb.from("profiles").select("*");
    (ps.data||[]).forEach(function(p){profs[p.id]=p});
    $("meta").textContent=Object.keys(profs).length+" عضو";
    var ms=await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(300);
    if(ms.error){$("msgs").innerHTML='<div class="sys">تعذّر تحميل الرسائل. قد لا تملك صلاحية الدخول.</div>';return}
    all=(ms.data||[]).reverse();render();$("msgs").scrollTop=$("msgs").scrollHeight;
    chan=sb.channel("room")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){addMsg(p.new)})
      .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},function(p){all=all.filter(function(x){return x.id!==p.old.id});render()})
      .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},function(p){
        if(p.new&&p.new.id){profs[p.new.id]=p.new;$("meta").textContent=Object.keys(profs).length+" عضو";render()}})
      .subscribe();
  }

  function linkify(node,text){
    var re=/(https?:\/\/[^\s<>"]+)/g,last=0,m;
    while((m=re.exec(text))){
      if(m.index>last)node.appendChild(document.createTextNode(text.slice(last,m.index)));
      var a=el("a","",m[1]);a.href=m[1];a.target="_blank";a.rel="noopener noreferrer";node.appendChild(a);last=re.lastIndex;
    }
    if(last<text.length)node.appendChild(document.createTextNode(text.slice(last)));
  }

  function showProf(id){
    var p=id===uid?prof:(profs[id]||{});var w=el("div","pv");
    w.appendChild(avatar(p));w.appendChild(el("h2","",p.name||"عضو"));
    w.appendChild(el("p","sub",p.bio||"لا توجد نبذة."));
    var c=el("button","ghost","إغلاق");c.onclick=closeM;w.appendChild(c);modal(w);
  }

  var sending=false;
  async function send(data){
    var r=await sb.from("messages").insert(data).select().single();
    if(r.error)throw r.error;addMsg(r.data);
  }
  $("f").addEventListener("submit",function(e){
    e.preventDefault();var v=$("txt").value.trim();if(!v||sending)return;
    sending=true;$("txt").value="";
    send({kind:"text",text:v}).catch(function(){$("txt").value=v;alert("تعذّر الإرسال.")}).then(function(){sending=false});
  });

  function shrink(f){
    return new Promise(function(res,rej){
      var im=new Image(),u=URL.createObjectURL(f);
      im.onload=function(){
        var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",0.85);
      };
      im.onerror=rej;im.src=u;
    });
  }
  async function upload(f){
    var isV=f.type.indexOf("video/")===0,isI=f.type.indexOf("image/")===0;
    if(!isV&&!isI)throw {msg:"نوع الملف غير مدعوم."};
    if(isV&&f.size>50*1024*1024)throw {msg:"حجم الفيديو يتجاوز 50 ميغابايت."};
    var b=isI?await shrink(f):f;
    var ext=isI?"jpg":(f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"mp4";
    var path=uid+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
    var r=await sb.storage.from("media").upload(path,b,{contentType:isI?"image/jpeg":f.type});
    if(r.error)throw {msg:"تعذّر رفع الملف."};
    return {path:path,kind:isV?"video":"image"};
  }
  $("att").onclick=function(){$("file").click()};
  $("file").onchange=async function(){
    var f=this.files[0];this.value="";if(!f)return;
    var p=$("pend");p.textContent="جارٍ الرفع…";p.classList.remove("hidden");
    try{
      var r=await upload(f);
      await send({kind:r.kind,media:r.path,text:$("txt").value.trim()});$("txt").value="";
    }catch(e){alert((e&&e.msg)||"تعذّر إرسال الملف.")}
    p.classList.add("hidden");
  };

  $("me").onclick=function(){
    var w=el("div");w.appendChild(el("h2","","ملفي الشخصي"));
    var av=avatar(prof);av.style.margin="0 auto";av.style.width="80px";av.style.height="80px";w.appendChild(av);
    var b=el("button","link","تغيير الصورة"),fi=el("input");fi.type="file";fi.accept="image/*";fi.className="hidden";
    b.onclick=function(){fi.click()};
    fi.onchange=async function(){
      var f=fi.files[0];if(!f)return;b.textContent="جارٍ الرفع…";
      try{var x=await shrink(f),path=uid+"/avatar-"+Date.now()+".jpg";
        var r=await sb.storage.from("media").upload(path,x,{contentType:"image/jpeg"});if(r.error)throw r.error;
        prof.avatar=path;await saveProf();profs[uid]=prof;render();$("me").click();
      }catch(e){b.textContent="تعذّر رفع الصورة"}
    };
    w.appendChild(b);w.appendChild(fi);
    w.appendChild(el("label","","الاسم"));var n=el("input");n.maxLength=24;n.value=prof.name||"";w.appendChild(n);
    w.appendChild(el("label","","نبذة عنك"));var t=el("textarea");t.maxLength=120;t.rows=3;t.value=prof.bio||"";w.appendChild(t);
    var s=el("button","full","حفظ");
    s.onclick=async function(){
      if(!n.value.trim())return;prof.name=n.value.trim();prof.bio=t.value.trim();ls("ops_name",prof.name);
      try{await saveProf();profs[uid]=prof;render();closeM()}catch(e){alert("تعذّر الحفظ.")}
    };
    w.appendChild(s);modal(w);
  };

  /* ---- المالك ---- */
  function adminLogin(){
    var w=el("div");w.appendChild(el("h2","","دخول المالك"));
    w.appendChild(el("label","","البريد الإلكتروني"));var e=el("input");e.type="email";e.style.direction="ltr";w.appendChild(e);
    w.appendChild(el("label","","كلمة المرور"));var p=el("input");p.type="password";p.style.direction="ltr";w.appendChild(p);
    var m=el("div","err");w.appendChild(m);
    var b=el("button","full","دخول");
    b.onclick=async function(){
      b.disabled=true;m.textContent="";
      var r=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});
      if(r.error){m.textContent="البريد أو كلمة المرور غير صحيحة.";b.disabled=false;return}
      location.reload();
    };
    w.appendChild(b);modal(w);
  }
  async function adminPanel(){
    var w=el("div");w.appendChild(el("h2","","رموز الدعوة"));
    w.appendChild(el("p","sub","أنشئ رمزًا لكل مجموعة وأرسله لهم. إيقاف الرمز يمنع الدخول به ويُخرج من انضم به."));
    var lab=el("input");lab.placeholder="وصف الرمز (اختياري)";w.appendChild(lab);
    var g=el("button","full","➕ إنشاء رمز جديد");w.appendChild(g);
    var list=el("div");w.appendChild(list);
    var cl=el("button","link","إغلاق");cl.onclick=closeM;w.appendChild(cl);
    var so=el("button","link","تسجيل خروج المالك");so.onclick=async function(){await sb.auth.signOut();location.reload()};w.appendChild(so);
    async function load(){
      var r=await sb.from("invite_codes").select("*").order("created_at",{ascending:false});
      list.innerHTML="";
      (r.data||[]).forEach(function(c){
        var row=el("div","codeitem"+(c.active?"":" off"));
        row.appendChild(el("b","",c.code));if(c.label)row.appendChild(el("span","",c.label));
        var cp=el("button","ghost","نسخ");cp.onclick=function(){
          var txt="رابط الدعوة:\n"+location.origin+location.pathname+"#"+c.code+"\nالرمز: "+c.code;
          try{navigator.clipboard.writeText(txt).then(function(){cp.textContent="✓"})}catch(e){prompt("انسخ:",txt)}};
        var tg=el("button","ghost",c.active?"إيقاف":"تفعيل");
        tg.onclick=async function(){
          tg.disabled=true;
          await sb.from("invite_codes").update({active:!c.active}).eq("code",c.code);
          if(c.active)await sb.from("members").delete().eq("code",c.code);
          load();
        };
        row.appendChild(cp);row.appendChild(tg);list.appendChild(row);
      });
    }
    g.onclick=async function(){
      var ab="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint8Array(10);crypto.getRandomValues(a);
      var c="OPS-"+Array.prototype.map.call(a,function(x){return ab[x%ab.length]}).join("");
      var r=await sb.from("invite_codes").insert({code:c,label:lab.value.trim()});
      if(r.error)return alert("تعذّر إنشاء الرمز.");lab.value="";load();
    };
    modal(w);load();
  }
  $("adm").onclick=function(){isAdmin?adminPanel():adminLogin()};
  $("adm2").onclick=adminPanel;
})();
</script>
</body>
</html>
